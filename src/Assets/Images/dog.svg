<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Background circle -->
  <circle cx="100" cy="100" r="95" fill="#87CEEB" stroke="#5BA4CF" stroke-width="3"/>

  <!-- Body -->
  <ellipse cx="100" cy="130" rx="45" ry="35" fill="#C8A26B"/>

  <!-- Head -->
  <circle cx="100" cy="85" r="32" fill="#C8A26B"/>

  <!-- Left ear (floppy) -->
  <ellipse cx="76" cy="72" rx="14" ry="22" fill="#A0724A" transform="rotate(-15 76 72)"/>

  <!-- Right ear (floppy) -->
  <ellipse cx="124" cy="72" rx="14" ry="22" fill="#A0724A" transform="rotate(15 124 72)"/>

  <!-- Snout -->
  <ellipse cx="100" cy="98" rx="16" ry="11" fill="#E8C89A"/>

  <!-- Nose -->
  <ellipse cx="100" cy="93" rx="7" ry="5" fill="#4A3728"/>

  <!-- Left eye -->
  <circle cx="88" cy="82" r="5" fill="#4A3728"/>
  <circle cx="89.5" cy="80.5" r="1.5" fill="white"/>

  <!-- Right eye -->
  <circle cx="112" cy="82" r="5" fill="#4A3728"/>
  <circle cx="113.5" cy="80.5" r="1.5" fill="white"/>

  <!-- Mouth / smile -->
  <path d="M93 102 Q100 108 107 102" stroke="#4A3728" stroke-width="2" fill="none" stroke-linecap="round"/>

  <!-- Tongue -->
  <ellipse cx="100" cy="107" rx="6" ry="5" fill="#E87070"/>

  <!-- Front left leg -->
  <rect x="75" y="155" width="14" height="28" rx="7" fill="#C8A26B"/>

  <!-- Front right leg -->
  <rect x="111" y="155" width="14" height="28" rx="7" fill="#C8A26B"/>

  <!-- Tail -->
  <path d="M145 125 Q165 105 155 90" stroke="#C8A26B" stroke-width="10" fill="none" stroke-linecap="round"/>

  <!-- Collar -->
  <rect x="80" y="113" width="40" height="8" rx="4" fill="#E74C3C"/>
  <circle cx="100" cy="121" r="3" fill="#F39C12"/>
</svg>
